name: easyenglish
description: "EasyEnglish - Learn English vocabulary with flashcards and spaced repetition"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  
  # State management
  provider: ^6.1.2
  
  # Typography
  google_fonts: ^6.2.1
  
  # Text-to-Speech for pronunciation
  flutter_tts: ^4.2.0
  
  # Charts for statistics
  fl_chart: ^0.70.2
  
  # Animations
  flutter_animate: ^4.5.2

  # iOS and Android Widgets
  home_widget: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  
  assets:
    - assets/data/
