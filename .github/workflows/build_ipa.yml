name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: node24

jobs:
  build:
    name: Build IPA (Unsigned / Sideload Ready)
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App (.app)
        run: flutter build ios --release --no-codesign --verbose

      - name: Package .app into .ipa
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r easyenglish.ipa Payload
          cd ../../..

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: easyenglish-ios-ipa
          path: build/ios/iphoneos/easyenglish.ipa
          retention-days: 7
